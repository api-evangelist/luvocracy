description: 'Luvocracy was a social-shopping and recommendation marketplace where people discovered,
  shared, and bought products curated by friends and trusted tastemakers, with the service handling the
  purchasing on the buyer''s behalf. Backed by GV (Google Ventures) and Kleiner Perkins, the company was
  acquired by @WalmartLabs in 2014 and subsequently wound down; its website (luvocracy.com) now serves an
  archived static page announcing the acquisition. No developer program, public API, or SDK was ever
  published, and none exists today. This profile is retained as a network record of a defunct consumer
  startup. Sector: consumer / social commerce.'
